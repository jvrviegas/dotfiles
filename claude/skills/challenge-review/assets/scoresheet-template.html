<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --paper: #FAFAF7; --card: #FFFFFF; --ink: #1C2321; --ink-soft: #55605B;
    --line: #D9DED9; --accent: #1E6B4F; --accent-soft: #E7F0EB;
    --red: #B4433A; --red-soft: #F7ECEA; --green: #2F7D4F; --green-soft: #EAF3ED;
    --amber: #9A6B1F; --panel: #F2F4F1;
    --shadow: 0 1px 2px rgba(28,35,33,.06), 0 4px 14px rgba(28,35,33,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #141816; --card: #1B211E; --ink: #E6EBE7; --ink-soft: #9AA69F;
      --line: #2C332F; --accent: #55B08C; --accent-soft: #1F2E28;
      --red: #D9776C; --red-soft: #2E1F1D; --green: #6FBE8F; --green-soft: #1D2B22;
      --amber: #CFA050; --panel: #202623;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --paper: #141816; --card: #1B211E; --ink: #E6EBE7; --ink-soft: #9AA69F;
    --line: #2C332F; --accent: #55B08C; --accent-soft: #1F2E28;
    --red: #D9776C; --red-soft: #2E1F1D; --green: #6FBE8F; --green-soft: #1D2B22;
    --amber: #CFA050; --panel: #202623;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
  :root[data-theme="light"] {
    --paper: #FAFAF7; --card: #FFFFFF; --ink: #1C2321; --ink-soft: #55605B;
    --line: #D9DED9; --accent: #1E6B4F; --accent-soft: #E7F0EB;
    --red: #B4433A; --red-soft: #F7ECEA; --green: #2F7D4F; --green-soft: #EAF3ED;
    --amber: #9A6B1F; --panel: #F2F4F1;
    --shadow: 0 1px 2px rgba(28,35,33,.06), 0 4px 14px rgba(28,35,33,.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }
  body {
    background: var(--paper); color: var(--ink);
    font-family: Charter, Georgia, 'Times New Roman', serif;
    font-size: 17px; line-height: 1.6;
  }
  .sans { font-family: 'Avenir Next', Avenir, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  code, .mono {
    font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .82em; background: var(--panel); border-radius: 4px; padding: .1em .35em;
  }

  .scorebar {
    position: sticky; top: 0; z-index: 50;
    background: var(--card); border-bottom: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .scorebar-inner {
    max-width: 860px; margin: 0 auto; padding: 10px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    font-family: 'Avenir Next', Avenir, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .scorebar .who { font-weight: 600; font-size: 14px; letter-spacing: .01em; }
  .scorebar .who small { display: block; font-weight: 400; color: var(--ink-soft); font-size: 11px; }
  .scorebar .spacer { flex: 1; }
  .totalchip { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
  .totalchip .num { font-size: 22px; font-weight: 700; color: var(--accent); }
  .totalchip .den { font-size: 13px; color: var(--ink-soft); }
  .band {
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px; background: var(--panel); color: var(--ink-soft);
  }
  .band[data-band="strong"] { background: var(--green-soft); color: var(--green); }
  .band[data-band="pass"]   { background: var(--accent-soft); color: var(--accent); }
  .band[data-band="border"] { background: var(--panel); color: var(--amber); }
  .band[data-band="fail"]   { background: var(--red-soft); color: var(--red); }
  .scorebar button {
    font: 600 12px/1 'Avenir Next', Avenir, 'Helvetica Neue', sans-serif;
    color: var(--ink-soft); background: none;
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  .scorebar button:hover { color: var(--red); border-color: var(--red); }
  .scorebar button:focus-visible, .seg label:focus-within, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .page { max-width: 860px; margin: 0 auto; padding: 40px 24px 90px; }
  header.masthead { padding: 18px 0 30px; border-bottom: 2px solid var(--ink); margin-bottom: 8px; }
  .eyebrow {
    font: 600 11px/1 'Avenir Next', Avenir, 'Helvetica Neue', sans-serif;
    letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
  }
  h1 {
    font-family: 'Avenir Next', Avenir, 'Helvetica Neue', Helvetica, sans-serif;
    font-size: clamp(28px, 4.5vw, 40px); font-weight: 700; line-height: 1.12;
    letter-spacing: -.015em; text-wrap: balance;
  }
  .masthead .sub { margin-top: 12px; color: var(--ink-soft); font-size: 16px; max-width: 62ch; }
  .facts {
    display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 20px;
    font-family: 'Avenir Next', Avenir, 'Helvetica Neue', sans-serif; font-size: 13px;
  }
  .facts div b { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 2px; }

  .callout {
    margin: 26px 0; padding: 16px 20px;
    background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0;
    font-size: 15.5px;
  }
  .callout > b { font-family: 'Avenir Next', Avenir, sans-serif; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 4px; }
  .callout.muted { background: var(--panel); border-left-color: var(--ink-soft); }
  .callout.muted > b { color: var(--ink-soft); }

  section.block { margin-top: 52px; }
  .sec-head {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 22px;
  }
  .sec-head h2 {
    font-family: 'Avenir Next', Avenir, 'Helvetica Neue', sans-serif;
    font-size: 21px; font-weight: 700; letter-spacing: -.01em;
  }
  .sec-head .snum {
    font-family: 'Avenir Next', Avenir, sans-serif;
    color: var(--accent); font-weight: 700; font-size: 21px; font-variant-numeric: tabular-nums;
  }
  .sec-head .meta {
    margin-left: auto; font: 500 12px/1.4 'Avenir Next', Avenir, sans-serif;
    color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums;
  }
  .sec-head .meta .secscore { color: var(--accent); font-weight: 700; }
  .sec-note { font-size: 15px; color: var(--ink-soft); font-style: italic; margin: -10px 0 20px; }

  .q {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); margin-bottom: 26px; overflow: hidden;
  }
  .q-top {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .q-top .qid { font: 700 13px/1 'Avenir Next', Avenir, sans-serif; color: var(--accent); font-variant-numeric: tabular-nums; }
  .q-top h3 { font: 600 15px/1.3 'Avenir Next', Avenir, 'Helvetica Neue', sans-serif; flex: 1; min-width: 180px; }
  .probe {
    font: 600 10px/1 'Avenir Next', Avenir, sans-serif; letter-spacing: .08em; text-transform: uppercase;
    color: var(--amber); border: 1px solid currentColor; border-radius: 999px; padding: 3px 8px; white-space: nowrap;
  }
  .q-body { padding: 20px 22px 22px; }
  .ask {
    font-size: 18px; line-height: 1.55; font-style: italic;
    padding-left: 16px; border-left: 3px solid var(--accent);
    margin-bottom: 18px; max-width: 68ch;
  }
  .ask::before { content: "Ask · "; font-style: normal; font: 600 11px/1 'Avenir Next', Avenir, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 6px; }
  .q h4 {
    font: 600 11px/1 'Avenir Next', Avenir, 'Helvetica Neue', sans-serif;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin: 18px 0 8px;
  }
  .q ul { padding-left: 20px; max-width: 70ch; }
  .q ul li { margin-bottom: 6px; font-size: 15.5px; }
  .q ul li::marker { color: var(--accent); }

  details.expected { background: var(--panel); border-radius: 8px; padding: 0; margin-top: 4px; }
  details.expected summary {
    cursor: pointer; padding: 10px 14px; list-style: none;
    font: 600 11px/1 'Avenir Next', Avenir, sans-serif; letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent); user-select: none;
  }
  details.expected summary::-webkit-details-marker { display: none; }
  details.expected summary::before { content: "▸ "; }
  details.expected[open] summary::before { content: "▾ "; }
  details.expected .inner { padding: 2px 16px 14px; }
  details.expected .inner ul li::marker { color: var(--ink-soft); }

  .flags { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  @media (max-width: 640px) { .flags { grid-template-columns: 1fr; } }
  .flag { border-radius: 8px; padding: 12px 14px; font-size: 14.5px; }
  .flag ul { padding-left: 18px; }
  .flag ul li { margin-bottom: 4px; font-size: 14.5px; }
  .flag b { font: 600 10.5px/1 'Avenir Next', Avenir, sans-serif; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 7px; }
  .flag.red { background: var(--red-soft); border-left: 3px solid var(--red); }
  .flag.red b { color: var(--red); }
  .flag.red ul li::marker { color: var(--red); }
  .flag.green { background: var(--green-soft); border-left: 3px solid var(--green); }
  .flag.green b { color: var(--green); }
  .flag.green ul li::marker { color: var(--green); }

  .scorer {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line);
    font-family: 'Avenir Next', Avenir, sans-serif;
  }
  .scorer .lbl { font: 600 11px/1 'Avenir Next', Avenir, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg label {
    position: relative; cursor: pointer;
    padding: 7px 15px; font: 600 14px/1 'Avenir Next', Avenir, sans-serif;
    color: var(--ink-soft); border-right: 1px solid var(--line);
    font-variant-numeric: tabular-nums; transition: background .12s, color .12s;
  }
  .seg label:last-child { border-right: none; }
  .seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .seg label:has(input:checked) { background: var(--accent); color: #fff; }
  .seg label:hover { background: var(--accent-soft); }
  .seg label:has(input:checked):hover { background: var(--accent); }
  .scorer .hint { font-size: 12px; color: var(--ink-soft); }

  .tablewrap { overflow-x: auto; }
  table {
    border-collapse: collapse; width: 100%; font-size: 14.5px;
    font-family: 'Avenir Next', Avenir, 'Helvetica Neue', sans-serif;
    font-variant-numeric: tabular-nums;
  }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
  td.num, th.num { text-align: right; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: none; }
  .qr td code { white-space: nowrap; }
  .qr td:first-child { font-weight: 600; white-space: nowrap; }

  .rec { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 4px; font-family: 'Avenir Next', Avenir, sans-serif; }
  .rec label {
    display: flex; align-items: center; gap: 7px;
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px;
    font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--ink-soft);
  }
  .rec label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rec input { accent-color: currentColor; margin: 0; }
  textarea {
    width: 100%; min-height: 130px; margin-top: 14px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    font: 15px/1.6 Charter, Georgia, serif; resize: vertical;
  }
  .weightnote { font-size: 15px; color: var(--ink-soft); max-width: 70ch; margin-top: 14px; }
  .subhead { font: 600 11px/1 'Avenir Next', Avenir, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin: 26px 0 8px; display: block; }

  footer.colophon {
    margin-top: 60px; padding-top: 16px; border-top: 1px solid var(--line);
    font: 400 12.5px/1.6 'Avenir Next', Avenir, sans-serif; color: var(--ink-soft);
  }

  @media print {
    .scorebar { position: static; box-shadow: none; }
    .scorebar button { display: none; }
    body { font-size: 12px; background: #fff; }
    .q { box-shadow: none; break-inside: avoid; }
    details.expected summary { display: none; }
    details.expected .inner { display: block !important; padding-top: 12px; }
    textarea { min-height: 220px; }
  }
</style>
</head>
<body>

<script id="interview-data" type="application/json">__INTERVIEW_DATA__</script>

<div class="scorebar" role="region" aria-label="Running score">
  <div class="scorebar-inner">
    <div class="who" id="barWho"></div>
    <div class="spacer"></div>
    <div class="totalchip" aria-live="polite">
      <span class="num" id="totalNum">0</span>
      <span class="den">/ <span id="maxTotal">0</span> · <span id="answeredCount">0</span>/<span id="qCount">0</span> scored</span>
    </div>
    <span class="band" id="bandChip" data-band="">no scores yet</span>
    <button type="button" id="resetBtn" title="Clear all scores, recommendation and notes">Reset</button>
  </div>
</div>

<div class="page">
  <header class="masthead">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="pageTitle"></h1>
    <p class="sub" id="subtitle"></p>
    <div class="facts" id="facts"></div>
  </header>

  <div id="callouts"></div>
  <div id="sections"></div>

  <section class="block">
    <div class="sec-head"><h2>Scoring Summary</h2></div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Section</th><th class="num">Max</th><th class="num">Score</th></tr></thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
    <span class="subhead">Score interpretation</span>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Range</th><th>Assessment</th></tr></thead>
        <tbody id="bandsBody"></tbody>
      </table>
    </div>
    <p class="weightnote" id="weightNote"></p>
  </section>

  <section class="block">
    <div class="sec-head"><h2>Final Assessment</h2></div>
    <span class="subhead" style="margin-top:0;">Overall recommendation</span>
    <div class="rec" id="recGroup" role="radiogroup" aria-label="Overall recommendation">
      <label><input type="radio" name="rec" value="strong-hire">Strong Hire</label>
      <label><input type="radio" name="rec" value="hire">Hire</label>
      <label><input type="radio" name="rec" value="lean-hire">Lean Hire</label>
      <label><input type="radio" name="rec" value="no-hire">No Hire</label>
      <label><input type="radio" name="rec" value="strong-no-hire">Strong No Hire</label>
    </div>
    <label for="notes" class="subhead">Interviewer notes</label>
    <textarea id="notes" placeholder="Observations, quotes, moments where the candidate recovered or stalled…"></textarea>
  </section>

  <section class="block" id="quickRefBlock">
    <div class="sec-head"><h2>Quick Reference — Key Implementation Details</h2></div>
    <div class="tablewrap">
      <table class="qr">
        <thead><tr><th>Item</th><th>Value / location</th></tr></thead>
        <tbody id="quickRefBody"></tbody>
      </table>
    </div>
  </section>

  <footer class="colophon" id="footerNote"></footer>
</div>

<script>
(function () {
  'use strict';
  var D = JSON.parse(document.getElementById('interview-data').textContent);
  var STORE_KEY = D.storeKey || 'interview-scoresheet';
  var BAND_LABELS = { strong: 'Strong Pass', pass: 'Pass', border: 'Borderline', fail: 'Fail' };
  var TH = D.thresholds || { strong: 0.8, pass: 0.6, border: 0.4 };

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function list(items) {
    var ul = document.createElement('ul');
    (items || []).forEach(function (i) { ul.appendChild(el('li', null, i)); });
    return ul;
  }

  // ---- static chrome from data ----
  document.getElementById('barWho').innerHTML = D.barTitle + '<small>' + (D.barSubtitle || '') + '</small>';
  document.getElementById('eyebrow').textContent = D.eyebrow || 'Internal — do not share with the candidate';
  document.getElementById('pageTitle').textContent = D.title;
  document.getElementById('subtitle').innerHTML = D.subtitle || '';
  (D.facts || []).forEach(function (f) {
    document.getElementById('facts').appendChild(el('div', null, '<b>' + f[0] + '</b>' + f[1]));
  });
  (D.callouts || []).forEach(function (c) {
    var box = el('div', 'callout' + (c.muted ? ' muted' : ''), '<b>' + c.label + '</b>' + c.html);
    document.getElementById('callouts').appendChild(box);
  });

  // ---- sections & questions ----
  var qCount = 0;
  var sectionsRoot = document.getElementById('sections');
  var summaryBody = document.getElementById('summaryBody');

  (D.sections || []).forEach(function (sec, si) {
    var snum = si + 1;
    var secMax = sec.questions.length * 5;
    var block = el('section', 'block');
    block.setAttribute('data-sec', snum);

    var head = el('div', 'sec-head');
    head.appendChild(el('span', 'snum', String(snum)));
    head.appendChild(el('h2', null, sec.title));
    head.appendChild(el('div', 'meta', (sec.meta || '') + '<br><span class="secscore" data-secscore="' + snum + '">0</span> / ' + secMax));
    block.appendChild(head);
    if (sec.note) block.appendChild(el('p', 'sec-note', sec.note));

    sec.questions.forEach(function (q, qi) {
      qCount += 1;
      var qid = 's' + snum + 'q' + (qi + 1);
      var displayId = q.id || (snum + '.' + (qi + 1));
      var card = el('article', 'q');
      card.setAttribute('data-q', qid);
      card.setAttribute('data-sec', snum);

      var top = el('div', 'q-top');
      top.appendChild(el('span', 'qid', displayId));
      top.appendChild(el('h3', null, q.topic));
      if (q.probe) top.appendChild(el('span', 'probe', q.probe));
      card.appendChild(top);

      var body = el('div', 'q-body');
      body.appendChild(el('p', 'ask', q.ask));

      if (q.expected && q.expected.length) {
        var det = document.createElement('details');
        det.className = 'expected'; det.open = true;
        det.appendChild(el('summary', null, 'Expected answer'));
        var inner = el('div', 'inner');
        inner.appendChild(list(q.expected));
        det.appendChild(inner);
        body.appendChild(det);
      }
      if (q.followups && q.followups.length) {
        body.appendChild(el('h4', null, 'Follow-ups'));
        body.appendChild(list(q.followups));
      }
      if ((q.red && q.red.length) || (q.green && q.green.length)) {
        var flags = el('div', 'flags');
        var red = el('div', 'flag red', '<b>Red flags</b>');
        red.appendChild(list(q.red));
        var green = el('div', 'flag green', '<b>Green flags</b>');
        green.appendChild(list(q.green));
        flags.appendChild(red); flags.appendChild(green);
        body.appendChild(flags);
      }

      var scorer = el('div', 'scorer');
      scorer.appendChild(el('span', 'lbl', 'Score'));
      var seg = el('div', 'seg');
      seg.setAttribute('role', 'radiogroup');
      seg.setAttribute('aria-label', 'Score for ' + displayId);
      seg.setAttribute('data-scoreseg', qid);
      scorer.appendChild(seg);
      scorer.appendChild(el('span', 'hint', '1–5'));
      body.appendChild(scorer);

      card.appendChild(body);
      block.appendChild(card);
    });

    sectionsRoot.appendChild(block);

    var row = el('tr', null,
      '<td>' + snum + ' · ' + sec.title + '</td><td class="num">' + secMax +
      '</td><td class="num" data-sumsec="' + snum + '">—</td>');
    summaryBody.appendChild(row);
  });

  var MAX_TOTAL = qCount * 5;
  summaryBody.appendChild(el('tr', 'total',
    '<td>Total</td><td class="num">' + MAX_TOTAL + '</td><td class="num" id="sumTotal">—</td>'));
  document.getElementById('maxTotal').textContent = String(MAX_TOTAL);
  document.getElementById('qCount').textContent = String(qCount);

  // ---- bands, weight note, quick ref, footer ----
  var bandsBody = document.getElementById('bandsBody');
  (D.bands || []).forEach(function (b) {
    bandsBody.appendChild(el('tr', null, '<td class="mono">' + b[0] + '</td><td>' + b[1] + '</td>'));
  });
  document.getElementById('weightNote').innerHTML = D.weightNote || '';
  var qr = D.quickRef || [];
  if (qr.length) {
    var qrBody = document.getElementById('quickRefBody');
    qr.forEach(function (r) {
      qrBody.appendChild(el('tr', null, '<td>' + r[0] + '</td><td>' + r[1] + '</td>'));
    });
  } else {
    document.getElementById('quickRefBlock').style.display = 'none';
  }
  document.getElementById('footerNote').innerHTML = (D.footer || '') +
    ' Scores, recommendation and notes are saved locally in this browser (localStorage) and survive a refresh; use Reset in the top bar to clear them. Print for a paper copy — expected answers expand automatically.';

  // ---- state ----
  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
  }
  function save(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }
  var state = load();
  state.scores = state.scores || {};

  document.querySelectorAll('[data-scoreseg]').forEach(function (seg) {
    var qid = seg.getAttribute('data-scoreseg');
    for (var v = 1; v <= 5; v++) {
      var label = document.createElement('label');
      var input = document.createElement('input');
      input.type = 'radio';
      input.name = 'score-' + qid;
      input.value = String(v);
      if (state.scores[qid] === v) input.checked = true;
      label.appendChild(input);
      label.appendChild(document.createTextNode(String(v)));
      seg.appendChild(label);
      input.addEventListener('change', function (e) {
        state.scores[qid] = parseInt(e.target.value, 10);
        save(state);
        render();
      });
    }
  });

  var recInputs = document.querySelectorAll('#recGroup input');
  recInputs.forEach(function (input) {
    if (state.rec === input.value) input.checked = true;
    input.addEventListener('change', function () { state.rec = input.value; save(state); });
  });

  var notes = document.getElementById('notes');
  notes.value = state.notes || '';
  notes.addEventListener('input', function () { state.notes = notes.value; save(state); });

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!confirm('Clear all scores, the recommendation and the notes?')) return;
    state = { scores: {} };
    save(state);
    document.querySelectorAll('.seg input, #recGroup input').forEach(function (i) { i.checked = false; });
    notes.value = '';
    render();
  });

  function render() {
    var total = 0, answered = 0, perSec = {};
    Object.keys(state.scores).forEach(function (qid) {
      var v = state.scores[qid];
      if (!v) return;
      total += v; answered += 1;
      var s = qid.slice(1, qid.indexOf('q'));
      perSec[s] = (perSec[s] || 0) + v;
    });

    document.getElementById('totalNum').textContent = String(total);
    document.getElementById('answeredCount').textContent = String(answered);

    (D.sections || []).forEach(function (_sec, si) {
      var s = String(si + 1);
      var val = perSec[s] || 0;
      var head = document.querySelector('[data-secscore="' + s + '"]');
      if (head) head.textContent = String(val);
      var sum = document.querySelector('[data-sumsec="' + s + '"]');
      if (sum) sum.textContent = perSec[s] === undefined ? '—' : String(val);
    });
    document.getElementById('sumTotal').textContent = answered ? String(total) : '—';

    var chip = document.getElementById('bandChip');
    var pct = MAX_TOTAL ? Math.round((total / MAX_TOTAL) * 100) : 0;
    if (answered === 0) {
      chip.dataset.band = ''; chip.textContent = 'no scores yet';
    } else if (answered < qCount) {
      chip.dataset.band = ''; chip.textContent = 'in progress · ' + pct + '%';
    } else {
      var ratio = total / MAX_TOTAL;
      var band = ratio >= TH.strong ? 'strong' : ratio >= TH.pass ? 'pass' : ratio >= TH.border ? 'border' : 'fail';
      chip.dataset.band = band;
      chip.textContent = BAND_LABELS[band] + ' · ' + pct + '%';
    }
  }

  render();
})();
</script>
</body>
</html>
