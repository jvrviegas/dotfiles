# macOS terminal; retain the shared config's fonts and input settings.
font_family JetBrainsMono Nerd Font
font_size 12.0
cursor_shape block
cursor_blink_interval 0
window_padding_width 2
shell_integration no-cursor
background_opacity 0.92
background_blur 24
# BEGIN_KITTY_THEME
include themes/golden-gate-after-dark.conf
# END_KITTY_THEME
